<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Usuario - Tech Store</title>

    <link rel="stylesheet" href="../css/estilos.css">

</head>

<body>

<header>

    <img src="../img/logo.png" alt="Logo Tech Store">

    <h1>Editar Usuario</h1>

<div id="cabeceraSesion" class="cabecera-sesion"></div>

</header>

<main>

    <section>

        <h2>Modificar usuario</h2>

        <form id="formUsuarioAdmin" novalidate>

            <label for="run">
                RUN:
            </label>

            <input type="text"
                   id="run"
                   name="run"
                   maxlength="9">

            <label for="nombre">
                Nombre:
            </label>

            <input type="text"
                   id="nombre"
                   name="nombre"
                   >

            <label for="apellido">
                Apellidos:
            </label>

            <input type="text"
                   id="apellido"
                   name="apellido"
                   >

            <label for="correo">
                Correo:
            </label>

            <input type="email"
                   id="correo"
                   name="correo"
                   >

            <label for="fechaNacimiento">
                Fecha de nacimiento:
            </label>

            <input type="date"
                   id="fechaNacimiento"
                   name="fechaNacimiento">

            <label for="tipoUsuario">
                Tipo de usuario:
            </label>

            <select id="tipoUsuario"
                    name="tipoUsuario">

                <option value="">
                    Seleccione un tipo
                </option>

                <option value="administrador">
                    Administrador
                </option>

                <option value="cliente">
                    Cliente
                </option>

                <option value="vendedor">
                    Vendedor
                </option>

            </select>

            <label for="region">
                Región:
            </label>

            <select id="region"
                    name="region">

                <option value="">
                    Seleccione una región
                </option>

            </select>

            <label for="comuna">
                Comuna:
            </label>

            <select id="comuna"
                    name="comuna">

                <option value="">
                    Seleccione una comuna
                </option>

            </select>

            <label for="direccion">
                Dirección:
            </label>

            <input type="text"
                   id="direccion"
                   name="direccion"
                   >

            <button type="submit">
                Guardar cambios
            </button>

            <div id="mensajeUsuarioAdmin"></div>

        </form>

        <p>
            <a href="usuarios-admin.html">
                Volver a usuarios
            </a>
        </p>

    </section>

</main>

<footer>

    <p>
        © 2026 Tech Store - Panel Administrador
    </p>

</footer>

<script src="../js/regiones.js"></script>

<script src="../js/usuarios.js"></script>
<script src="../js/admin-usuarios.js"></script>
<script src="../js/sesion.js"></script>

<script src="../js/permisos.js"></script>

</body>
</html>
