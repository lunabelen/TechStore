</head>


<body>


<header>

    <img src="../img/logo.png" alt="Logo Tech Store">

    <h1>Tech Store</h1>

    <nav>

        </a>

    </nav>

</header>



<main>


<section>

    <h2>Contáctanos</h2>


    <form id="formContacto" novalidate>


        <label for="nombre">
            Nombre:
        </label>

        <input 
        type="text"
        id="nombre"
        name="nombre"
        required>




        <label for="correo">
            Correo:
        </label>

        <input 
        type="email"
        id="correo"
        name="correo"
        required>


        


        <label for="mensaje">
            Mensaje:
        </label>

        <textarea 
        id="mensaje"
        name="mensaje"
        required>
        </textarea>


      


        <button type="submit">
            Enviar mensaje
        </button>

        <div id="mensajeContacto"></div>


    </form>


</section>


</main>



<footer>

    <p>
        © 2026 Tech Store - Todos los derechos reservados
    </p>

</footer>
