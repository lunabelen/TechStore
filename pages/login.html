<main>


<section>

    <h2>Inicio de sesión</h2>


    <form id="formLogin" novalidate>


        <label for="correo">
            Correo electrónico:
        </label>

        <input 
        type="email" 
        id="correo"
        name="correo"
        required>


     


        <label for="password">
            Contraseña:
        </label>

        <input 
        type="password"
        id="password"
        name="password"
        required>
        
        <div id="mensajePassword"></div>

      


        <button type="submit">
            Ingresar
        </button>
        <div id="mensajeLogin"></div>

        <p>
    ¿No tienes cuenta?
    <a href="registro.html">Crear cuenta</a>
</p>


    </form>
