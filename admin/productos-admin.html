<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos Administrador - Tech Store</title>

    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <header>
        <img src="../img/logo.png" alt="Logo Tech Store">
        <h1>Administración de Productos</h1>
    <div id="cabeceraSesion" class="cabecera-sesion"></div>
    </header>

    <main>

        <section>

            <h2>Productos</h2>

            <p>
                Desde esta sección puedes revisar los productos
                disponibles en Tech Store.
            </p>

            <a href="nuevo-producto.html" class="solo-admin">
                Nuevo producto
            </a>

            <table>

                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th class="solo-admin">Acción</th>
                    </tr>
                </thead>

                <tbody id="cuerpoProductos">
                    <!-- Filas generadas dinámicamente por js/productos-admin-listado.js -->
                </tbody>

            </table>

            <p class="solo-admin">
                <a href="index.html">
                    Volver al panel administrador
                </a>
            </p>

        </section>

    </main>

    <footer>
        <p>
            © 2026 Tech Store - Panel Administrador
        </p>
    </footer>

    <script src="../js/productos.js"></script>

    <script src="../js/productos-admin-listado.js"></script>

    <script src="../js/sesion.js"></script>

<script src="../js/permisos.js"></script>

</body>

</html>
