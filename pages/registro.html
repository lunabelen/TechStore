<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - Tech Store</title>

    <link rel="stylesheet" href="../css/estilos.css">

</head>


<body>


<header>

    <img src="../img/logo.png" alt="Logo Tech Store">

    <h1>Tech Store</h1>

    <nav>

        <a href="../index.html">Inicio</a>

        <a href="productos.html">Productos</a>

        <a href="nosotros.html">Nosotros</a>

        <a href="blog.html">Blog</a>

        <a href="registro.html">Registro</a>

        <a href="login.html">Login</a>

        <a href="contacto.html">Contacto</a>

        <a href="carrito.html" class="carrito">
            🛒 Carrito: <span id="contadorCarrito">0</span>
        </a>

    </nav>

</header>



<main>


<section>


<h2>Crear cuenta</h2>


<form id="formRegistro" novalidate>
<label for="nombre">
Nombres:
</label>

<input type="text" id="nombre" name="nombre" required>

<label for="apellido">
    Apellidos:
</label>

<input type="text" id="apellido" name="apellido" required>

<label for="run">
    RUN:
</label>

<input type="text"
       id="run"
       name="run"
       placeholder="Ej: 19011022K"
       maxlength="9"
       required>


<label for="direccion">
    Dirección:
</label>

<input type="text" id="direccion" name="direccion" required>

<label for="region">
    Región:
</label>

<select id="region" name="region" required>
    <option value="">Seleccione una región</option>
</select>

<label for="comuna">
    Comuna:
</label>

<select id="comuna" name="comuna" required>
    <option value="">Seleccione una comuna</option>
</select>



<label for="correo">
Correo:
</label>

<input type="email" id="correo" name="correo" required>

<label for="fechaNacimiento">
    Fecha de nacimiento:
</label>

<input type="date"
       id="fechaNacimiento"
       name="fechaNacimiento">



<label for="password">
Contraseña:
</label>

<input type="password" id="password" name="password" required>



<label for="confirmarPassword">
Confirmar contraseña:
</label>

<input type="password" id="confirmarPassword" name="confirmarPassword" required>



<button type="submit">
Registrarse
</button>

<div id="mensajeValidacion"></div>


</form>


</section>


</main>



<footer>

<p>
© 2026 Tech Store - Todos los derechos reservados
</p>

</footer>

<script src="../js/regiones.js"></script>

<script src="../js/usuarios.js"></script>

<script src="../js/validaciones.js"></script>

<script src="../js/sesion.js"></script>

</body>

</html>
